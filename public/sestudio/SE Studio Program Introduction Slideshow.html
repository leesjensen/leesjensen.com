<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1728">
  <title>SE Studio Program — Introduction</title>
  <style>
    :root { color-scheme: dark; --ink: #eef5ff; --muted: #9cafc7; --panel: rgba(18, 34, 56, .84); --panel-strong: rgba(23, 43, 70, .96); --line: rgba(178, 203, 232, .22); --accent: #43d6ca; --accent-2: #ff947e; --blue: #3d8dff; --navy: #0c1d33; --gray: #5d6570; --light: #f1f3f5; --shadow: 0 24px 80px rgba(0, 0, 0, .36); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #091321; }
    body { min-height: 100vh; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 12% 0%, rgba(67, 214, 202, .14), transparent 34rem), radial-gradient(circle at 90% 8%, rgba(255, 148, 126, .12), transparent 28rem), #091321; overflow: hidden; }
    button { font: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: clamp(12px, 2.2vw, 34px); gap: clamp(10px, 1.6vw, 22px); }
    .topbar, .controls { width: 100%; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark { width: 38px; height: 38px; border-radius: 13px; background: linear-gradient(135deg, var(--accent), #1888a4); box-shadow: 0 8px 28px rgba(67, 214, 202, .22); position: relative; flex: 0 0 auto; }
    .mark::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #091321; left: 13px; top: 13px; }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .title { margin-top: 3px; font-weight: 700; font-size: clamp(14px, 1.6vw, 21px); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .stage-wrap { min-height: 0; width: 100%; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: clamp(8px, 1.8vw, 26px); }
    .stage { min-width: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; overflow: hidden; }
    .slide-frame { min-height: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; padding: clamp(8px, 1.2vw, 16px); background: rgba(1, 8, 17, .42); box-shadow: var(--shadow); }
    .html-slide { position: relative; display: block; flex: 0 0 auto; width: 100%; height: 100%; max-width: 100%; max-height: 100%; overflow: hidden; background: #fff; color: #111; border-radius: 7px; box-shadow: 0 8px 30px rgba(0, 0, 0, .34); container-type: inline-size; }
    .nav, .control, .dot { border: 1px solid var(--line); color: var(--ink); background: var(--panel); cursor: pointer; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    .nav:hover, .control:hover, .dot:hover, .nav:focus-visible, .control:focus-visible, .dot:focus-visible { background: var(--panel-strong); border-color: rgba(67, 214, 202, .72); outline: none; transform: translateY(-1px); }
    .nav { width: 42px; height: 64px; border-radius: 15px; display: grid; place-items: center; font-size: 24px; }
    .controls { display: grid; grid-template-columns: auto minmax(80px, 1fr) auto; align-items: center; gap: 12px; }
    .control { min-height: 36px; border-radius: 10px; padding: 0 13px; font-size: 12px; font-weight: 750; }
    .progress { height: 4px; border-radius: 20px; overflow: hidden; background: rgba(178, 203, 232, .18); }
    .progress span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .25s ease; }
    .slide-caption { width: 100%; display: flex; align-items: center; justify-content: flex-start; gap: 20px; padding: 0 4px; }
    .slide-caption span { color: var(--ink); font-size: 13px; font-weight: 700; }
    .overview { position: fixed; inset: 0; z-index: 4; padding: clamp(18px, 4vw, 60px); overflow: auto; background: rgba(5, 12, 22, .97); backdrop-filter: blur(16px); }
    .overview-header { max-width: 1500px; margin: 0 auto 22px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .overview h2 { margin: 0; font-size: clamp(21px, 3vw, 38px); letter-spacing: -.04em; }
    .overview-grid { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; }
    .thumb { padding: 0; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-align: left; cursor: pointer; transition: transform .16s ease, border-color .16s ease; }
    .thumb:hover, .thumb:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
    .thumb-preview { width: 100%; aspect-ratio: 16 / 9; display: grid; place-items: center; padding: 10%; background: linear-gradient(135deg, #f8fafc 0 70%, #eaf5ff 70%); color: #0c1d33; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .thumb-preview.dark { background: #0c1d33; color: #6dcbf4; }
    .thumb-label { display: flex; gap: 9px; padding: 11px 12px 13px; font-size: 12px; font-weight: 750; }
    .thumb-label span { color: var(--accent); font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }

    .first-slide-html { display: grid; grid-template-columns: 42% 58%; background: #fff; color: #111; }
    .first-slide-left { min-width: 0; padding: 9% 9%; background: var(--navy); color: #fff; display: flex; flex-direction: column; }
    .first-slide-eyebrow { color: #6dcbf4; font-size: clamp(13px, 1.15cqw, 18px); font-weight: 800; letter-spacing: .07em; }
    .first-slide-left h1 { margin: 10% 0 0; font-size: clamp(34px, 4.25cqw, 68px); line-height: 1.08; letter-spacing: -.045em; }
    .first-slide-description { max-width: 92%; margin: auto 0 0; color: #d7e7f5; font-size: clamp(18px, 1.75cqw, 29px); line-height: 1.22; }
    .first-slide-footer { margin-top: 12%; }
    .first-slide-rule { width: 78%; height: .45cqw; min-height: 4px; background: #6dcbf4; }
    .first-slide-example { display: block; margin-top: 7%; font-size: clamp(17px, 1.55cqw, 25px); line-height: 1.2; }
    .first-slide-meta { display: block; margin-top: 4%; color: #b8cce0; font-size: clamp(13px, 1.1cqw, 18px); }
    .first-slide-right { min-width: 0; padding: 9% 10%; display: flex; flex-direction: column; justify-content: center; }
    .first-slide-intro { margin: 0 0 8%; color: var(--gray); font-size: clamp(17px, 1.65cqw, 27px); line-height: 1.3; }
    .first-slide-value-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8%; }
    .first-slide-value { min-width: 0; padding: 4.5% 0; border-top: 1px solid #b8bcc4; }
    .first-slide-value strong { display: block; color: #172b46; font-size: clamp(16px, 1.45cqw, 24px); line-height: 1.2; }
    .first-slide-value p { margin: 3% 0 0; color: var(--gray); font-size: clamp(14px, 1.2cqw, 20px); line-height: 1.25; }
    .content-slide { padding: 5.6% 5.6% 4.3%; display: flex; flex-direction: column; }
    .slide-kicker { color: var(--blue); font-size: clamp(13px, 1.05cqw, 17px); font-weight: 800; letter-spacing: .03em; }
    .slide-title { margin: 1.8% 0 0; color: #111; font-size: clamp(30px, 3.1cqw, 52px); line-height: 1.12; letter-spacing: -.035em; }
    .slide-subtitle { margin: 1.5% 0 0; color: var(--gray); font-size: clamp(16px, 1.7cqw, 27px); line-height: 1.28; }
    .slide-footer { margin-top: auto; padding-top: 1.2%; border-top: 1px solid #b8bcc4; color: var(--gray); font-size: clamp(11px, 1cqw, 16px); font-weight: 700; }
    .why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4.8%; margin-top: 6%; }
    .why-card { min-width: 0; border-top: .45cqw solid var(--blue); padding-top: 2.5%; }
    .why-card.green { border-color: #5c9f7a; }
    .why-card.gold { border-color: #d9a441; }
    .eyebrow-card { font-size: clamp(10px, 1.25cqw, 18px); font-weight: 800; letter-spacing: .03em; color: var(--blue); }
    .why-card.green .eyebrow-card { color: #5c9f7a; }
    .why-card.gold .eyebrow-card { color: #d9a441; }
    .why-card h3 { margin: 7% 0 0; font-size: clamp(19px, 2cqw, 32px); line-height: 1.16; }
    .why-card p { margin: 10% 0 0; color: var(--gray); font-size: clamp(14px, 1.4cqw, 22px); line-height: 1.25; }
    .dark-callout { margin-top: auto; padding: 2.2% 2.5%; border-radius: 1cqw; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 3%; }
    .dark-callout strong { color: #6dcbf4; font-size: clamp(12px, 1.25cqw, 20px); }
    .dark-callout span { font-size: clamp(13px, 1.6cqw, 25px); font-weight: 800; }
    .loop-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1.6%; margin-top: 7%; }
    .loop-item { min-width: 0; position: relative; }
    .loop-item:not(:last-child)::after { content: "→"; position: absolute; z-index: 1; top: 50%; right: -15%; transform: translateY(-50%); color: #b8bcc4; font-size: clamp(18px, 2cqw, 30px); font-weight: 800; }
    .loop-card { min-width: 0; min-height: 21cqw; height: 100%; padding: 8% 10%; border: 1px solid #b8bcc4; border-radius: 1cqw; background: #f1f3f5; position: relative; }
    .loop-card.evaluate { background: #eaf5ff; border-color: #6dcbf4; }
    .loop-number { color: var(--gray); font-size: clamp(10px, 1cqw, 16px); font-weight: 800; }
    .loop-card h3 { margin: 22% 0 0; font-size: clamp(15px, 1.55cqw, 24px); line-height: 1.1; }
    .loop-card p { margin: 9% 0 0; color: var(--gray); font-size: clamp(13px, 1.3cqw, 20px); line-height: 1.2; white-space: pre-line; }
    .loop-bottom { margin-top: 5%; padding-top: 2%; border-top: .3cqw solid var(--blue); display: flex; gap: 4%; color: var(--gray); font-size: clamp(13px, 1.4cqw, 22px); }
    .loop-bottom strong { color: #111; }
    .architecture-grid { display: grid; grid-template-columns: 27% 1fr; gap: 8%; margin-top: 5%; align-items: start; }
    .stat-card { min-height: 25cqw; padding: 10%; border-radius: 1cqw; background: var(--navy); color: #fff; }
    .stat-card .big { display: block; font-size: clamp(44px, 5.5cqw, 82px); line-height: 1; font-weight: 800; }
    .stat-card strong { display: block; margin-top: 3%; color: #6dcbf4; font-size: clamp(15px, 1.8cqw, 27px); }
    .stat-card p { margin: 10% 0 0; color: #d7e7f5; font-size: clamp(12px, 1.35cqw, 21px); line-height: 1.25; }
    .arch-rows { display: grid; }
    .arch-row { display: grid; grid-template-columns: 1fr auto; gap: 4%; align-items: center; padding: 2.1% 0; border-bottom: 1px solid #b8bcc4; font-size: clamp(14px, 1.55cqw, 24px); }
    .arch-row:first-child { border-top: .45cqw solid var(--blue); }
    .arch-row strong { font-size: clamp(15px, 1.75cqw, 27px); }
    .arch-row b { font-size: clamp(17px, 2.1cqw, 32px); }
    .arch-note { margin-top: 4%; color: var(--blue); font-size: clamp(11px, 1.25cqw, 18px); font-weight: 800; }
    .course-grid { display: grid; grid-template-columns: 1fr auto 1fr auto 1.45fr; gap: 2.2%; align-items: center; margin-top: 7%; }
    .course { min-height: 22cqw; padding: 8%; border-top: .5cqw solid var(--blue); background: #f8fafc; }
    .course.green { border-color: #5c9f7a; }
    .course.gold { border-color: #d9a441; }
    .course h3 { margin: 0; color: var(--blue); font-size: clamp(20px, 2.3cqw, 34px); }
    .course.green h3 { color: #5c9f7a; }
    .course.gold h3 { color: #d9a441; }
    .course small { display: block; margin-top: 4%; color: var(--gray); font-size: clamp(11px, 1.2cqw, 18px); font-weight: 700; }
    .course p { margin: 12% 0 0; color: #111; font-size: clamp(12px, 1.4cqw, 21px); line-height: 1.25; }
    .course-arrow { color: #b8bcc4; font-size: clamp(22px, 2.5cqw, 38px); font-weight: 800; }
    .support-strip { margin-top: auto; padding: 2% 2.2%; border-radius: 1cqw; background: #eaf5ff; display: flex; justify-content: space-between; gap: 3%; align-items: center; }
    .support-strip strong { color: var(--blue); font-size: clamp(12px, 1.35cqw, 20px); }
    .support-strip span { color: #111; font-size: clamp(13px, 1.55cqw, 23px); font-weight: 800; }
    .support-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6%; margin-top: 7%; }
    .support-card { min-width: 0; padding-top: 4%; border-top: .5cqw solid var(--blue); }
    .support-card.green { border-color: #5c9f7a; }
    .support-card.gold { border-color: #d9a441; }
    .support-card h3 { margin: 0; color: var(--blue); font-size: clamp(21px, 2.1cqw, 32px); }
    .support-card.green h3 { color: #5c9f7a; }
    .support-card.gold h3 { color: #d9a441; }
    .support-card h4 { margin: 4% 0 0; font-size: clamp(13px, 1.45cqw, 22px); }
    .support-card ul { margin: 9% 0 0; padding: 0; list-style: none; color: #111; font-size: clamp(12px, 1.35cqw, 20px); line-height: 1.9; }
    .support-card li::before { content: "•"; color: var(--blue); margin-right: .7em; font-weight: 800; }
    .outcome-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10%; margin-top: 5%; }
    .section-label { color: var(--blue); font-size: clamp(11px, 1.15cqw, 17px); font-weight: 800; letter-spacing: .03em; }
    .governance-list { margin-top: 5%; display: grid; gap: 6%; }
    .governance-list div { padding: 3% 0 3% 4%; border-left: .45cqw solid var(--blue); font-size: clamp(14px, 1.45cqw, 22px); font-weight: 800; }
    .aims-list { margin-top: 4%; display: grid; gap: 4%; }
    .aims-list div strong { display: block; font-size: clamp(14px, 1.6cqw, 24px); }
    .aims-list div span { display: block; margin-top: 1.5%; color: var(--gray); font-size: clamp(11px, 1.25cqw, 18px); }
    .invite-list { margin-top: 5%; display: grid; }
    .invite-row { display: grid; grid-template-columns: 25% 1fr 24%; gap: 4%; align-items: center; padding: 3.2% 0; border-bottom: 1px solid #b8bcc4; border-left: .45cqw solid var(--blue); padding-left: 2.5%; }
    .invite-row:nth-child(2) { border-left-color: #6dcbf4; }
    .invite-row:nth-child(3) { border-left-color: var(--blue); }
    .invite-row:nth-child(4) { border-left-color: #6dcbf4; }
    .invite-row strong { color: var(--blue); font-size: clamp(11px, 1.3cqw, 19px); }
    .invite-row:nth-child(2) strong, .invite-row:nth-child(4) strong { color: var(--navy); }
    .invite-row b { font-size: clamp(13px, 1.55cqw, 24px); line-height: 1.2; }
    .invite-row span { color: var(--gray); font-size: clamp(11px, 1.2cqw, 18px); }
    .example-grid, .cg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9%; margin-top: 5%; }
    .step-list { display: grid; gap: 4%; }
    .step { display: grid; grid-template-columns: auto 1fr; gap: 3%; align-items: center; padding: 3.2% 4%; border: 1px solid #b8bcc4; border-radius: 1cqw; background: #f1f3f5; }
    .step-num { color: var(--gray); font-size: clamp(17px, 2cqw, 30px); font-weight: 800; }
    .step strong { display: block; font-size: clamp(11px, 1.3cqw, 19px); }
    .step span { display: block; margin-top: 1.5%; color: var(--gray); font-size: clamp(10px, 1.15cqw, 17px); }
    .feature-list { margin-top: 3%; display: grid; }
    .feature-list .section-label { margin-bottom: 3%; }
    .feature-row { padding: 3.5% 0; border-bottom: 1px solid #b8bcc4; font-size: clamp(13px, 1.6cqw, 24px); }
    .feature-row:first-of-type { border-top: .45cqw solid var(--blue); font-weight: 800; }
    .feature-emphasis { margin-top: 7%; color: var(--navy); font-size: clamp(15px, 1.8cqw, 27px); font-weight: 800; line-height: 1.2; }
    .purpose p { margin-top: 8%; color: #111; font-size: clamp(15px, 1.7cqw, 26px); line-height: 1.35; }
    .participant-list { margin-top: 4%; display: grid; }
    .participant { padding: 3.3% 0; border-bottom: 1px solid #b8bcc4; }
    .participant strong { display: block; font-size: clamp(14px, 1.5cqw, 23px); }
    .participant span { display: block; margin-top: 1.5%; color: var(--gray); font-size: clamp(11px, 1.25cqw, 19px); }
    .light-callout { margin-top: auto; padding: 2% 2.4%; border: 1px solid #6dcbf4; border-radius: 1cqw; background: #eaf5ff; color: var(--navy); font-size: clamp(11px, 1.25cqw, 19px); font-weight: 800; }
    .promise-slide { padding: 5.6% 5.6% 4.3%; background: var(--navy); color: #fff; display: flex; flex-direction: column; }
    .promise-slide .slide-kicker { color: #6dcbf4; }
    .promise-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 10%; align-items: start; margin-top: 6%; }
    .promise-main h1 { margin: 0; font-size: clamp(29px, 3.7cqw, 58px); line-height: 1.2; letter-spacing: -.035em; white-space: pre-line; }
    .promise-rule { width: 70%; height: .35cqw; margin: 7% 0 5%; background: #6dcbf4; }
    .promise-main p { color: #d7e7f5; font-size: clamp(14px, 1.8cqw, 28px); line-height: 1.25; white-space: pre-line; }
    .promise-card { padding: 8%; border-radius: 1cqw; background: #173552; }
    .promise-card h2 { margin: 0; color: #6dcbf4; font-size: clamp(15px, 1.65cqw, 25px); line-height: 1.2; }
    .promise-card ul { margin: 8% 0 0; padding: 0; list-style: none; font-size: clamp(13px, 1.45cqw, 22px); line-height: 1.8; }
    .promise-card li::before { content: "•"; color: var(--blue); margin-right: .8em; }
    .promise-footer { margin-top: auto; display: flex; gap: 3%; align-items: center; color: #6dcbf4; font-size: clamp(11px, 1.2cqw, 18px); font-weight: 800; }
    @container (max-width: 900px) {
      .why-grid, .support-grid { gap: 3%; }
      .course-grid { grid-template-columns: 1fr 1fr 1.25fr; }
      .course-arrow { display: none; }
      .invite-row { grid-template-columns: 25% 1fr; }
      .invite-row span { grid-column: 2; }
    }
    @container (max-width: 720px) {
      .first-slide-html { grid-template-columns: 1fr; overflow: auto; }
      .first-slide-left { padding: 7% 8%; }
      .first-slide-left h1 { margin-top: 6%; }
      .first-slide-description { margin-top: 7%; }
      .first-slide-footer { margin-top: 8%; }
      .first-slide-right { padding: 7% 8%; }
      .first-slide-intro { margin-bottom: 5%; }
      .content-slide, .promise-slide { padding: 7% 7% 5%; }
      .why-grid, .support-grid, .outcome-grid, .example-grid, .cg-grid, .promise-grid { grid-template-columns: 1fr; gap: 6%; }
      .loop-grid { grid-template-columns: repeat(3, 1fr); row-gap: 4%; }
      .loop-item:nth-child(3n)::after { display: none; }
      .architecture-grid { grid-template-columns: 1fr; gap: 5%; }
      .course-grid { grid-template-columns: 1fr; gap: 4%; }
      .support-strip { display: block; }
      .support-strip span { display: block; margin-top: 2%; }
      .invite-row { grid-template-columns: 1fr; gap: 3%; }
      .invite-row span { grid-column: auto; }
      .promise-grid { margin-top: 5%; }
    }
    @media (max-width: 640px) {
      body { overflow: auto; }
      .app { min-height: 100svh; padding: 12px; gap: 12px; }
      .hint { display: none; }
      .stage-wrap { grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; }
      .nav { width: 32px; height: 52px; border-radius: 11px; font-size: 19px; }
      .slide-frame { border-radius: 12px; padding: 5px; }
      .slide-caption { align-items: flex-start; }
      .controls { grid-template-columns: auto 1fr auto; }
      .controls .progress { grid-column: 1 / -1; grid-row: 1; }
      .controls .control:first-child { grid-column: 1; grid-row: 2; }
      .controls .control:last-child { grid-column: 3; grid-row: 2; }
    }
</style>
</head>
<body>
  <main class="app" aria-label="SE Studio Program slideshow">
    <header class="topbar"><div class="brand"><div class="mark" aria-hidden="true"></div><div><div class="eyebrow">10-minute introduction</div><div class="title">SE Studio Program</div></div></div><div class="hint">← → navigate · Space next · O overview · F fullscreen</div></header>
    <section class="stage-wrap" aria-label="Current slide"><button class="nav" id="previous" aria-label="Previous slide">‹</button><div class="stage"><div class="slide-frame" id="slideFrame" tabindex="0"></div><div class="slide-caption" aria-live="polite"><span id="slideTitle"></span></div></div><button class="nav" id="next" aria-label="Next slide">›</button></section>
    <footer class="controls"><button class="control" id="overviewButton">Overview</button><div class="progress" aria-hidden="true"><span id="progressBar"></span></div><button class="control" id="fullscreenButton">Fullscreen</button></footer>
  </main>
  <section class="overview" id="overview" hidden aria-label="Slide overview"><div class="overview-header"><h2>Slide overview</h2><button class="control" id="closeOverview">Close</button></div><div class="overview-grid" id="overviewGrid"></div></section>
  <script>
    const slides = [{"number":1,"title":"SE STUDIO PROGRAM"},{"number":2,"title":"WHY THIS MODEL"},{"number":3,"title":"A COMMON WAY OF WORKING"},{"number":4,"title":"PROGRAM ARCHITECTURE"},{"number":5,"title":"THREE-COURSE PATHWAY"},{"number":6,"title":"DEPTH IN PARALLEL"},{"number":7,"title":"OUTCOMES AND STEWARDSHIP"},{"number":8,"title":"A SHARED INVITATION"},{"number":9,"title":"EXAMPLE PROJECT"},{"number":10,"title":"EXAMPLE PROJECT"},{"number":11,"title":"THE PROGRAM PROMISE"}];
    let current = 0;
    let activeShell = null;
    const frame = document.getElementById('slideFrame');
    const title = document.getElementById('slideTitle');
    const progressBar = document.getElementById('progressBar');
    const overview = document.getElementById('overview');
    const overviewGrid = document.getElementById('overviewGrid');

    function fitActiveSlide() {
      if (!activeShell) return;
      const frameStyle = getComputedStyle(frame);
      const paddingX = parseFloat(frameStyle.paddingLeft) + parseFloat(frameStyle.paddingRight);
      const paddingY = parseFloat(frameStyle.paddingTop) + parseFloat(frameStyle.paddingBottom);
      const availableWidth = frame.clientWidth - paddingX;
      const availableHeight = frame.clientHeight - paddingY;
      if (availableWidth <= 0 || availableHeight <= 0) return;
      const ratio = 16 / 9;
      const width = Math.min(availableWidth, availableHeight * ratio);
      activeShell.style.width = width + 'px';
      activeShell.style.height = (width / ratio) + 'px';
    }

    function header(kicker, heading, subtitle) {
      return '<div class="slide-kicker">' + kicker + '</div><h1 class="slide-title">' + heading + '</h1>' + (subtitle ? '<p class="slide-subtitle">' + subtitle + '</p>' : '');
    }
    function footer() { return '<div class="slide-footer">SE Studio Program</div>'; }
    function shell(className, content) { const root = document.createElement('div'); root.className = 'html-slide ' + className; root.innerHTML = content; return root; }

    function slideOne() {
      return '<div class="first-slide-left"><div class="first-slide-eyebrow">SE STUDIO PROGRAM</div><h1>From social need<br>to open-source<br>software</h1><p class="first-slide-description">A three-course pathway for learning, building, and serving through Software Engineering</p><div class="first-slide-footer"><div class="first-slide-rule"></div><strong class="first-slide-example">CommonGround — a worked example</strong><span class="first-slide-meta">10-minute introduction</span></div></div><div class="first-slide-right"><p class="first-slide-intro">Students learn by building a real application with a real team, from first idea to reliable release.</p><div class="first-slide-value-grid"><div class="first-slide-value"><strong>Enterprise practice</strong><p>Build, deploy, and manage a production-minded application.</p></div><div class="first-slide-value"><strong>Large-team collaboration</strong><p>Work across feature, QA, security, UX, architecture, and compliance.</p></div><div class="first-slide-value"><strong>Passion into product</strong><p>Move from a problem you care about to an open-source solution.</p></div><div class="first-slide-value"><strong>Lasting human impact</strong><p>Deliver value for real people and leave a maintainable public asset.</p></div></div></div>';
    }
    function slideTwo() {
      return header('WHY THIS MODEL', 'The program turns learning into a real engineering journey', 'Students do not just study software engineering concepts; they use them together on a project that matters.') + '<div class="why-grid"><div class="why-card"><div class="eyebrow-card">REAL MISSION</div><h3>Build for a defined social or humanitarian need.</h3><p>A problem worth understanding</p></div><div class="why-card green"><div class="eyebrow-card">REAL PRACTICE</div><h3>Work in feature teams and ship usable software.</h3><p>A system worth maintaining</p></div><div class="why-card gold"><div class="eyebrow-card">REAL STEWARDSHIP</div><h3>Keep quality, safety, privacy, and inclusion in the room.</h3><p>A public good worth protecting</p></div></div><div class="dark-callout"><strong>Outcome</strong><span>Students leave with judgment, evidence, and a production-minded portfolio — not just a demo.</span></div>' + footer();
    }
    function slideThree() {
      const cards = [['01','FRAME','Who is affected?\nWhat matters?'],['02','RESEARCH','What already exists?\nWhat can we learn?'],['03','DESIGN','What should we build\nand why?'],['04','BUILD','Can we make a\nworking slice?'],['05','VERIFY / TEST','Does it meet\nits promises?'],['06','EVALUATE','Is it useful, safe,\nand worth continuing?']];
      return header('A COMMON WAY OF WORKING', 'Every team uses the same Software Engineering loop', '') + '<div class="loop-grid">' + cards.map((c, i) => '<div class="loop-item"><div class="loop-card ' + (i === 5 ? 'evaluate' : '') + '"><div class="loop-number">' + c[0] + '</div><h3>' + c[1] + '</h3><p>' + c[2] + '</p></div></div>').join('') + '</div><div class="loop-bottom"><strong>The loop repeats at three scales</strong><span>project selection  •  feature delivery  •  production release</span></div>' + footer();
    }
    function slideFour() {
      const rows = [['8 feature teams','32','var(--blue)'],['App-level QA','5','#5c9f7a'],['Security / Privacy','4','#d9a441'],['HCI / UX','4','#6dcbf4'],['Compliance','3','#9d7bc0'],['Architecture / Integration','2','var(--navy)']];
      return header('PROGRAM ARCHITECTURE', 'Fifty programmers become one coordinated program', 'The structure creates many bounded places to contribute without losing a shared system vision.') + '<div class="architecture-grid"><div class="stat-card"><span class="big">50</span><strong>student programmers</strong><p>plus 5 peer mentors<br>and 5 faculty members</p></div><div><div class="arch-rows">' + rows.map(r => '<div class="arch-row"><strong style="border-left:.35cqw solid ' + r[2] + '; padding-left:2.5%">' + r[0] + '</strong><b style="color:' + r[2] + '">' + r[1] + '</b></div>').join('') + '</div><div class="arch-note">Technical Design Council aligns shared interfaces and decisions.</div></div></div>' + footer();
    }
    function slideFive() {
      return header('THREE-COURSE PATHWAY', 'The course sequence moves from framing to production', '') + '<div class="course-grid"><div class="course"><h3>CS 380</h3><small>3 credits · Fall</small><p>Frame the problem, research the landscape, design a solution, and build a rough prototype.</p></div><div class="course-arrow">→</div><div class="course green"><h3>CS 480</h3><small>6 credits · Winter</small><p>Implement the MVP or beta release with working team integration.</p></div><div class="course-arrow">→</div><div class="course gold"><h3>CS 481</h3><small>6 credits · Fall</small><p>Move into production and deliver multiple releases with focus on scale, security, and quality.</p></div></div><div class="support-strip"><strong>Parallel with CS 480</strong><span>CS 329 QA &amp; DevOps  ·  CS 452 Database  ·  CS 348 Agent Engineering</span></div>' + footer();
    }
    function slideSix() {
      const cards = [['CS 329','QA & DevOps',['Test strategy','CI / CD','Observability','Release + recovery'],''],['CS 452','Database',['Data model','Local-first persistence','Sync + conflicts','Backup + portability'],'green'],['CS 348','Agent Engineering',['Bounded use cases','Tools + retrieval','Evaluation','Safety + oversight'],'gold']];
      return header('DEPTH IN PARALLEL', 'Support courses make the main studio executable', 'The support courses are not separate mini-projects. They use the CS 380 project and feed artifacts into CS 480.') + '<div class="support-grid">' + cards.map(c => '<div class="support-card ' + c[3] + '"><h3>' + c[0] + '</h3><h4>' + c[1] + '</h4><ul>' + c[2].map(x => '<li>' + x + '</li>').join('') + '</ul></div>').join('') + '</div><div class="dark-callout"><span>One project context  →  shared interfaces  →  one beta with evidence behind it</span></div>' + footer();
    }
    function slideSeven() {
      return header('OUTCOMES AND STEWARDSHIP', 'Quality and learning are governed together', 'The program evaluates both what students build and how they learn to build it responsibly.') + '<div class="outcome-grid"><div><div class="section-label">CROSS-CUTTING GOVERNANCE</div><div class="governance-list"><div>App-level QA</div><div>Security / Privacy</div><div>HCI / UX</div><div>Compliance</div><div>Architecture / Integration</div></div></div><div><div class="section-label">AIMS OF A BYU EDUCATION</div><div class="aims-list"><div><strong style="color:var(--blue)">Spiritually strengthening</strong><span>Human dignity, stewardship, service</span></div><div><strong>Intellectually enlarging</strong><span>Reasoning, communication, technical depth</span></div><div><strong>Character building</strong><span>Integrity, accountability, perseverance</span></div><div><strong>Lifelong learning + service</strong><span>Open source, mentoring, continued contribution</span></div></div></div></div><div class="dark-callout"><span>Evidence: research  →  design record  →  code + tests  →  release evidence  →  reflection + handoff</span></div>' + footer();
    }
    function slideEight() {
      const rows = [['STUDENTS','Join a team, build a portfolio, and learn to serve through software.','Choose a role and contribute.'],['CS FACULTY','Teach concepts in context and mentor bounded areas of the system.','Sponsor a topic or milestone.'],['UNIVERSITY','Showcase mission-aligned experiential learning and open-source impact.','Support coordination and visibility.'],['EXTERNAL COLLABORATORS','Offer domain knowledge and feedback with bounded risk and no heavy management burden.','Bring a challenge, review, or pilot.']];
      return header('A SHARED INVITATION', 'The program is designed for participation', 'Each stakeholder gets a meaningful role without having to carry the whole program.') + '<div class="invite-list">' + rows.map(r => '<div class="invite-row"><strong>' + r[0] + '</strong><b>' + r[1] + '</b><span>' + r[2] + '</span></div>').join('') + '</div><div class="light-callout">The ask: select a mission, assemble the support structure, and invite people into a clear next step.</div>' + footer();
    }
    function slideNine() {
      const steps = [['1','REQUEST HELP','A person posts a need with privacy and consent controls.'],['2','FIND A MATCH','The system suggests an offer or volunteer without making a high-stakes decision.'],['3','COORDINATE','People communicate safely and arrange the handoff.']];
      return header('EXAMPLE PROJECT', 'CommonGround: the example project', 'This example shows how one project fills the program structure.') + '<div class="example-grid"><div class="step-list">' + steps.map(s => '<div class="step"><div class="step-num">' + s[0] + '</div><div><strong>' + s[1] + '</strong><span>' + s[2] + '</span></div></div>').join('') + '</div><div class="feature-list"><div class="section-label">FEATURE TEAM EXAMPLES</div><div class="feature-row"><b>Needs &amp; Offers</b>  ·  Matching</div><div class="feature-row">Volunteer Coordination  ·  Messaging</div><div class="feature-row">Resource &amp; Inventory  ·  Maps</div><div class="feature-row">Offline Sync  ·  Moderation</div><div class="feature-emphasis">One application. Many bounded contributions. One shared mission.</div></div></div>' + footer();
    }
    function slideTen() {
      return header('EXAMPLE PROJECT', 'CommonGround turns local goodwill into coordinated help', 'A privacy-preserving, open-source, local-first platform for requesting, offering, and coordinating community resources.') + '<div class="cg-grid"><div class="purpose"><div class="section-label">PURPOSE</div><p>Help often exists, but it is scattered across texts, spreadsheets, social groups, and paper lists. CommonGround gives a community one consent-based place to coordinate the handoff.</p></div><div><div class="section-label">VALUE FOR PARTICIPANTS</div><div class="participant-list"><div class="participant"><strong>Residents</strong><span>Ask for help or offer help with privacy, consent, and clear next steps.</span></div><div class="participant"><strong>Community groups</strong><span>Coordinate existing resources without buying a large case-management system.</span></div><div class="participant"><strong>Volunteers and donors</strong><span>Match time, skills, transportation, and supplies to specific needs.</span></div></div></div></div><div class="light-callout">The goal is to strengthen trusted community relationships, not to replace trusted organizations or make eligibility, medical, or legal decisions.</div>' + footer();
    }
    function slideEleven() {
      return '<div class="promise-grid"><div class="promise-main"><div class="slide-kicker">THE PROGRAM PROMISE</div><h1>Build something that matters.\nLearn how to build it well.\nLeave something others can use.</h1><div class="promise-rule"></div><p>CommonGround is one example.\nThe reusable asset is the program.</p></div><div class="promise-card"><h2>A successful graduate can explain:</h2><ul><li>the problem</li><li>the evidence</li><li>the design</li><li>the tests</li><li>the tradeoffs</li><li>the next step</li></ul></div></div><div class="promise-footer">SE Studio Program</div>';
    }
    function markupForSlide(number) {
      if (number === 1) return slideOne();
      if (number === 2) return slideTwo();
      if (number === 3) return slideThree();
      if (number === 4) return slideFour();
      if (number === 5) return slideFive();
      if (number === 6) return slideSix();
      if (number === 7) return slideSeven();
      if (number === 8) return slideEight();
      if (number === 9) return slideNine();
      if (number === 10) return slideTen();
      return slideEleven();
    }
    function createSlide(slide) {
      const root = shell(slide.number === 1 ? 'first-slide-html' : (slide.number === 11 ? 'promise-slide' : 'content-slide'), markupForSlide(slide.number));
      root.classList.add('responsive-slide');
      return root;
    }
    function renderSlide(index) {
      current = (index + slides.length) % slides.length;
      const slide = slides[current];
      frame.replaceChildren();
      activeShell = createSlide(slide);
      frame.appendChild(activeShell);
      requestAnimationFrame(fitActiveSlide);
      title.textContent = slide.title;
      progressBar.style.width = (((current + 1) / slides.length) * 100) + '%';
      document.title = slide.title + ' — SE Studio Program';
    }
    function move(delta) { renderSlide(current + delta); }
    function toggleOverview(force) { overview.hidden = typeof force === 'boolean' ? !force : !overview.hidden; if (!overview.hidden) document.getElementById('thumb-' + current)?.focus(); }
    function buildOverview() {
      slides.forEach((slide, index) => {
        const button = document.createElement('button');
        button.className = 'thumb'; button.id = 'thumb-' + index; button.type = 'button';
        const preview = document.createElement('div'); preview.className = 'thumb-preview' + (slide.number === 11 ? ' dark' : ''); preview.textContent = slide.title;
        button.appendChild(preview);
        const label = document.createElement('div'); label.className = 'thumb-label'; label.innerHTML = '<span>' + String(index + 1).padStart(2, '0') + '</span><strong>' + slide.title + '</strong>'; button.appendChild(label);
        button.addEventListener('click', () => { renderSlide(index); toggleOverview(false); }); overviewGrid.appendChild(button);
      });
    }
    async function toggleFullscreen() { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen?.(); }
    document.getElementById('previous').addEventListener('click', () => move(-1)); document.getElementById('next').addEventListener('click', () => move(1)); document.getElementById('overviewButton').addEventListener('click', () => toggleOverview()); document.getElementById('closeOverview').addEventListener('click', () => toggleOverview(false)); document.getElementById('fullscreenButton').addEventListener('click', toggleFullscreen); frame.addEventListener('click', () => move(1));
    document.addEventListener('keydown', (event) => { if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') { event.preventDefault(); move(1); } else if (event.key === 'ArrowLeft' || event.key === 'PageUp') { event.preventDefault(); move(-1); } else if (event.key === 'Home') { event.preventDefault(); renderSlide(0); } else if (event.key === 'End') { event.preventDefault(); renderSlide(slides.length - 1); } else if (event.key.toLowerCase() === 'o') { event.preventDefault(); toggleOverview(); } else if (event.key.toLowerCase() === 'f') { event.preventDefault(); toggleFullscreen(); } else if (event.key === 'Escape' && !overview.hidden) { toggleOverview(false); } });
    window.addEventListener('resize', fitActiveSlide); const frameResizeObserver = new ResizeObserver(() => requestAnimationFrame(fitActiveSlide)); frameResizeObserver.observe(frame); window.visualViewport?.addEventListener('resize', fitActiveSlide);
    buildOverview(); renderSlide(0);
</script>
</body>
